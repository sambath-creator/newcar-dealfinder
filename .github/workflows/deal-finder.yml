name: Car Deal Finder

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"  # 07:30 Europe/London during BST; UTC schedule shifts in winter

permissions:
  contents: read

jobs:
  find-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run deal finder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          PYTHONPATH: src
        run: python -m dealfinder --config config/config.yaml --demo

      - name: Upload deal history
        uses: actions/upload-artifact@v4
        with:
          name: deal-history
          path: data/deals.db
          if-no-files-found: ignore
